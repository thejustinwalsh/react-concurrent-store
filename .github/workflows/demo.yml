# Deploying by hand needs none of this: `wrangler login` does an OAuth flow in
# a browser, then `pnpm --filter @react-concurrent-store/app cf:deploy`.
#
# CI has no browser, so it needs an API token instead:
#   CLOUDFLARE_API_TOKEN   dash.cloudflare.com → My Profile → API Tokens →
#                          Create Token → "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  `wrangler whoami` prints it once you are logged in
name: Deploy Demo to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "demo"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app consumes the built package, not its source, so the "use client"
      # directive is in the graph. It has to exist before Next compiles.
      - run: pnpm --filter react-concurrent-store build

      # next build, then the Cloudflare adapter turns it into a Worker.
      - run: pnpm --filter @react-concurrent-store/app cf:build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/app
          command: deploy
